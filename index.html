<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار رفع الموقع</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2ecc71;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 مبروك! الموقع شغال تمام</h1>
        <p>إذا كنت شايف الصفحة دي، يبقى كود الاختبار اترفع بنجاح والمكان اللي بترفع عليه سليم.</p>
        <p>وقت التجرية: <span id="time"></span></p>
    </div>

    <script>
        // سكريبت بسيط بس عشان يطمنك إن الجافاسكريبت كمان شغال
        document.getElementById('time').innerText = new Date().toLocaleTimeString('ar-EG');
    </script>
</body>
</html>
